<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! ❤️</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Handwritten Style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Dancing+Script:wght@700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f7ede2;
            background-image: radial-gradient(#e8d8c8 1px, transparent 1px);
            background-size: 22px 22px;
            color: #4a3e3d;
        }

        .font-handwritten {
            font-family: 'Caveat', cursive;
        }

        .font-romantic {
            font-family: 'Dancing Script', cursive;
        }

        /* 3D Flip Card Effect */
        .flip-card {
            perspective: 1000px;
            width: 100%;
            max-width: 28rem; /* matches max-w-md */
            height: 360px;
            cursor: pointer;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.5rem; /* matches rounded-3xl */
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid #fce7f3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .flip-card-front {
            background-color: #ffffff;
        }

        .flip-card-back {
            background-color: #ffffff;
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Flippable Card Container -->
    <div class="flip-card" onclick="this.classList.toggle('flipped')">
        <div class="flip-card-inner">
            
            <!-- Front of Card -->
            <div class="flip-card-front space-y-4">
                <div class="text-6xl animate-bounce">🎁</div>
                <h1 class="font-romantic text-5xl md:text-6xl font-bold text-pink-700">
                    Happy Birthday, My Love! ❤️
                </h1>
                <p class="text-sm font-bold uppercase tracking-widest text-pink-400 mt-4">
                    Tap to open 🔄
                </p>
            </div>

            <!-- Back of Card -->
            <div class="flip-card-back">
                <div class="text-4xl mb-3">🎂</div>
                <div class="font-handwritten text-2xl md:text-3xl text-stone-700 leading-relaxed">
                    <p>
                        Happy Birthday! I hope your day is as wonderful and bright as you are.
                    </p>
                    <p class="mt-4 font-bold text-pink-600">
                        No matter what, my love for you will always be there.
                    </p>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
